media:
  input: public/assets
  output: /assets
  categories: [ "image" ]
content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    view:
      fields: [ coverImage, title, date, published ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: excerpt, label: Excerpt, type: string, required: true }
      - { name: coverImage, label: Cover image, type: image, required: true }
      - { name: date, label: Date, type: date, options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" } }
      - name: author
        label: Author
        type: object
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: picture, label: Picture, type: image, required: true }
      - name: ogImage
        label: Image (social sharing)
        type: object
        fields:
          - { name: url, label: URL, type: image, required: true }
      - { name: body, label: Body, type: rich-text, required: true }

  - name: pages
    label: Pages
    type: collection
    path: _pages
    view:
      fields: [ title, slug, showInHeader, footerColumn ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: navTitle, label: Navigation Title, type: string, description: "Title to display in navigation (uses page title if empty)" }
      - { name: showInHeader, label: Show in Header Menu, type: boolean, default: false }
      - { name: headerOrder, label: Menu Order, type: number, description: "Order in header navigation (lower = first)" }
      - name: footerColumn
        label: Footer Column
        type: string
        options:
          values: [ "company", "resources", "contact", "legal", "none" ]
        default: "none"
        description: "Which footer column to show this page in (company, resources, contact, legal, none)"
      - { name: footerOrder, label: Footer Order, type: number, description: "Order within footer column (lower = first)" }
      - { name: lastModified, label: Last Modified, type: date }
      - { name: effectiveDate, label: Effective Date, type: date }
      - { name: body, label: Content, type: rich-text }
  - name: external_links
    label: External Links
    type: collection
    path: _external_links
    view:
      fields: [ title, url, footerColumn ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: url, label: URL, type: string, required: true }
      - name: footerColumn
        label: Footer Column
        type: string
        options:
          values: [ "company", "resources", "contact", "legal", "none" ]
        required: true
        description: "Which footer column to show this link in (company, resources, contact, legal, none)"
      - { name: order, label: Order, type: number, description: "Order within footer column (lower = first)" }
      - { name: description, label: Description, type: string }

  # Products, Solutions and Apps: one entry per page at /products/<slug>, /solutions/<slug>, /apps/<slug>.
  # An entry is shown only when Published is on. Status "coming" lists it with a Coming tag and no page.
  - name: products
    label: Products
    type: collection
    path: _products
    view:
      fields: [ title, status, published, order ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true, description: "The last part of the URL, e.g. studio" }
      - { name: navTitle, label: Menu title, type: string, description: "Shorter title for the menu (uses Title if empty)" }
      - { name: tagline, label: Tagline, type: string, description: "One line shown on cards and under the page title" }
      - name: status
        label: Status
        type: string
        options:
          values: [ "live", "coming" ]
        default: "live"
        description: "live: has its own page. coming: listed with a Coming tag, no page."
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Order, type: number, description: "Order in menus and lists (lower = first)" }
      - { name: body, label: Content, type: rich-text }
  - name: solutions
    label: Solutions
    type: collection
    path: _solutions
    view:
      fields: [ title, status, published, order ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true, description: "The last part of the URL, e.g. studio" }
      - { name: navTitle, label: Menu title, type: string, description: "Shorter title for the menu (uses Title if empty)" }
      - { name: tagline, label: Tagline, type: string, description: "One line shown on cards and under the page title" }
      - name: status
        label: Status
        type: string
        options:
          values: [ "live", "coming" ]
        default: "live"
        description: "live: has its own page. coming: listed with a Coming tag, no page."
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Order, type: number, description: "Order in menus and lists (lower = first)" }
      - { name: body, label: Content, type: rich-text }
  - name: apps
    label: Apps
    type: collection
    path: _apps
    view:
      fields: [ title, status, published, order ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true, description: "The last part of the URL, e.g. studio" }
      - { name: navTitle, label: Menu title, type: string, description: "Shorter title for the menu (uses Title if empty)" }
      - { name: tagline, label: Tagline, type: string, description: "One line shown on cards and under the page title" }
      - name: status
        label: Status
        type: string
        options:
          values: [ "live", "coming" ]
        default: "live"
        description: "live: has its own page. coming: listed with a Coming tag, no page."
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Order, type: number, description: "Order in menus and lists (lower = first)" }
      - { name: body, label: Content, type: rich-text }

  # Commons editorial pages at /commons/<slug> (the slug "index" is the Commons home introduction).
  # Jurisdiction and Act pages are generated from github.com/legalese/commons and are not edited here.
  - name: commons
    label: Commons pages
    type: collection
    path: _commons
    view:
      fields: [ title, slug, published, order ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true, description: "The last part of the URL, e.g. studio" }
      - { name: navTitle, label: Menu title, type: string, description: "Shorter title for the menu (uses Title if empty)" }
      - { name: tagline, label: Tagline, type: string, description: "One line shown on cards and under the page title" }
      - name: status
        label: Status
        type: string
        options:
          values: [ "live", "coming" ]
        default: "live"
        description: "live: has its own page. coming: listed with a Coming tag, no page."
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Order, type: number, description: "Order in menus and lists (lower = first)" }
      - { name: body, label: Content, type: rich-text }
